      <h1>Songbook Lite</h1>
      <p>Your mixing desks' show files, in a browser tab: inspect, document, convert, write back.</p>
      <p>A desktop show-file library for digital mixing desks: Allen &amp; Heath SQ, dLive and Avantis, and Yamaha CL/QL, TF, DM3 and DM7. Every show is kept with a version history and the vendor file it came from. You can look at and edit the I/O and patch, the channels, the sends, the buses, the DCAs and mute groups and the scenes. It writes PDF documentation, an input-list CSV, printable label strips and Bitfocus Companion pages; it converts a show between desks with a report of what carried over, what was adapted and what was dropped; it writes SQ shows and CL/QL files back with their checksums intact; and it pulls from and pushes to the live desk over MIDI/TCP or SCP. Songbook Lite runs the same in a browser tab.</p>
      <p>Songbook Lite runs entirely in your browser and needs JavaScript and WebAssembly.</p>
      <ul>

        <li><a href="https://github.com/stoatworks-labs/songbook">Source on GitHub</a></li>
      </ul>
    </noscript>
