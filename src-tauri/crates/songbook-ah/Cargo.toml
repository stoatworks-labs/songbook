[package]
name = "songbook-ah"
description = "Allen & Heath driver: SQ NVDATA/scene images, dLive and Avantis show archives, and MIDI over TCP/IP to the live desks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
songbook-model = { path = "../songbook-model" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }
tar = "0.4"
# Held on 9.0: from 9.1 zip always pulls in getrandom with `wasm_js` on wasm32,
# which links wasm-bindgen into Songbook Lite and gives it imports (ci.yml's
# "The wasm imports nothing"). 9.0.5 has every fix the advisories asked for.
zip = { version = "~9.0.5", default-features = false, features = ["deflate"] }
