# Keeps dependencies current across the fleet.
#
# Minor and patch bumps are grouped into a single PR per ecosystem per week, so
# routine drift costs one review rather than twenty. Majors still arrive as
# their own PRs, because they need reading.
#
# Deliberately no `ignore:` rules — an ignore also suppresses the *security*
# update for that dependency, which is exactly the PR worth having.
# The exception is the cargo `ignore:` below: zip 9.1+ cannot build Songbook Lite.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Peer-locked families move together, whatever the bump size. A major that
      # arrives for one member without the others is how react 19 shipped against
      # react-dom 18 and took a hosted app down for three weeks (RFutils #22).
      # These sit ABOVE the minor-and-patch group because Dependabot files a
      # dependency under the first group that matches it.
      react-family:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "react-refresh"]
        update-types: ["major", "minor", "patch"]
      vite-toolchain:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*", "esbuild", "electron-vite", "rolldown", "rolldown-vite"]
        update-types: ["major", "minor", "patch"]
      eslint-typescript:
        patterns: ["eslint", "@eslint/*", "eslint-plugin-*", "eslint-config-*", "typescript-eslint", "@typescript-eslint/*", "typescript"]
        update-types: ["major", "minor", "patch"]
      electron-family:
        patterns: ["electron", "electron-builder", "@electron/*", "@electron-forge/*"]
        update-types: ["major", "minor", "patch"]
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # The Rust side lives under src-tauri, which is its own workspace; the member
  # crates build into it, so this one directory covers them all.
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # From 9.1 zip always pulls in getrandom with `wasm_js` on wasm32, which links
    # wasm-bindgen into Songbook Lite and fails ci.yml's "The wasm imports nothing"
    # (#29 rewrote songbook-ah's `~9.0.5` hold to `~9.1.3`). Delete this once zip
    # makes getrandom optional again; the hold in songbook-ah/Cargo.toml goes with it.
    ignore:
      - dependency-name: "zip"
        versions: [">= 9.1"]
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
